<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="44" dy="0">The whole</tspan><tspan x="44" dy="22">story, one page</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="44" dy="0">Who I am, where I</tspan><tspan x="44" dy="21">have worked, what I</tspan><tspan x="44" dy="21">built and what people</tspan><tspan x="44" dy="21">say, on one long</tspan><tspan x="44" dy="21">landing page.</tspan></text>
