<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="468" dy="0">Recent posts and the</tspan><tspan x="468" dy="21">now page come from</tspan><tspan x="468" dy="21">the same source</tspan><tspan x="468" dy="21">read.me.at publishes,</tspan><tspan x="468" dy="21">so they cannot drift.</tspan></text>
