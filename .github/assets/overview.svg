<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="256" dy="0">Every public *.me.at</tspan><tspan x="256" dy="21">site, grouped into</tspan><tspan x="256" dy="21">sites, content and</tspan><tspan x="256" dy="21">tools, built from the</tspan><tspan x="256" dy="21">shared registry.</tspan></text>
